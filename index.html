<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard Systems | Otimizando o Amanhã</title>
    <style>
        body { 
            background: #ffffff; 
            color: #333; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        
        .logo { width: 300px; margin-bottom: 20px; }
        
        h1 { font-weight: 300; letter-spacing: 2px; text-transform: uppercase; font-size: 1.5em; color: #002b5c; }
        .slogan { font-style: italic; color: #666; margin-bottom: 40px; }
        .status { 
            background: #f8f9fa; 
            padding: 15px; 
            border-left: 4px solid #00aeef; 
            text-align: left; 
            font-size: 0.9em;
            color: #555;
        }
        .footer { position: fixed; bottom: 20px; width: 100%; font-size: 0.7em; color: #999; text-align: center; left: 0;}
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="Vanguard Logo" class="logo">
        <p class="slogan">"Otimizando a humanidade, um byte de cada vez."</p>
        
        <div class="status">
            <strong>STATUS DO SISTEMA:</strong><br>
            Portal em manutenção programada para implementação do Protocolo Chimera.
            <br><br>
            <em>Agradecemos sua paciência enquanto reescrevemos o futuro.</em>
        </div>
    </div>
    
    <div class="footer">© 2026 Vanguard Systems Inc. Todos os direitos reservados.</div>
</body>
</html>
