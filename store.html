<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Seguro | Vanguard Premium</title>
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .checkout-container { background: #fff; width: 100%; max-width: 400px; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { margin: 0; color: #1a1a1a; font-size: 1.4em; }
        .header p { color: #666; font-size: 0.9em; margin-top: 5px; }
        
        .product-summary { background: #f8f9fa; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #e9ecef; }
        .row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9em; }
        .total { font-weight: bold; font-size: 1.2em; color: #002b5c; margin-top: 10px; border-top: 1px solid #ddd; padding-top: 10px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85em; color: #333; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1em; transition: border 0.3s; }
        input:focus { border-color: #00aeef; outline: none; }
        
        .btn-pay { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 1em; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-pay:hover { background: #218838; }
        
        .secure-badge { text-align: center; margin-top: 20px; font-size: 0.8em; color: #888; display: flex; align-items: center; justify-content: center; gap: 5px; }
        
        #hidden-content { display: none; margin-top: 20px; text-align: center; animation: fadeIn 0.5s; }
        .success-box { background: #d4edda; color: #155724; padding: 15px; border-radius: 4px; border: 1px solid #c3e6cb; }
        .download-btn { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #002b5c; color: white; text-decoration: none; border-radius: 4px; font-size: 0.9em; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div class="header">
            <h2>Finalizar Pedido</h2>
            <p>Vanguard Systems Inc.</p>
        </div>

        <div class="product-summary">
            <div class="row">
                <span>Produto:</span>
                <span>Pacote Chimera Premium (Vitalício)</span>
            </div>
            <div class="row">
                <span>Upload Digital:</span>
                <span>Incluso</span>
            </div>
            <div class="total row">
                <span>Total:</span>
                <span id="price-display">R$ 987,00</span>
            </div>
        </div>

        <div class="form-group">
            <label>Seu melhor e-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
            <label>Cupom de Desconto</label>
            <input type="text" id="coupon" placeholder="Possui um código?">
        </div>

        <button class="btn-pay" onclick="processPayment()">COMPRAR AGORA</button>

        <div class="secure-badge">
            🔒 Pagamento 100% Seguro • Criptografia SSL 256-bit
        </div>

        <div id="hidden-content">
            <div class="success-box">
                <strong>CUPOM APLICADO!</strong><br>
                Desconto de 100% autorizado pelo Admin.<br>
                <small>Bem-vindo ao programa, Usuário Null.</small>
                <br>
                <a href="SEU_LINK_DA_MISSAO_AQUI" class="download-btn" target="_blank">BAIXAR ARQUIVOS DA MISSÃO</a>
            </div>
        </div>
    </div>

    <script>
        function processPayment() {
            var email = document.getElementById('email').value;
            var coupon = document.getElementById('coupon').value.toUpperCase().trim();
            var hiddenDiv = document.getElementById('hidden-content');
            var priceDisplay = document.getElementById('price-display');

            var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {
                alert("Por favor, insira um e-mail válido para receber seu acesso.");
                return;
            }

            if (coupon === "USER_NULL") {
                priceDisplay.innerHTML = "<span style='color:#28a745; text-decoration:none;'>R$ 0,00</span> <small style='color:#999; text-decoration:line-through'>R$ 987,00</small>";
                hiddenDiv.style.display = "block";
                // Desabilita o botão para não clicar de novo
                document.querySelector('.btn-pay').style.display = 'none';
            } else {
                alert("ERRO: Pagamento recusado. Cartão não autorizado ou cupom inválido.");
            }
        }
    </script>

</body>
</html>
